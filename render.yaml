services:
  - type: web
    name: apprenticeships-reviews-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "python -m waitress --host=0.0.0.0 --port=$PORT config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false # set to your Render domain, e.g. apprenticeships-reviews-api.onrender.com
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: CORS_ALLOWED_ORIGINS
        sync: false # your Hostinger domain, e.g. https://apprenticeshipsreviews.com
      - key: FRONTEND_URL
        sync: false # same as above, used to build password-reset links
      - key: OPENAI_API_KEY
        sync: false # platform.openai.com/api-keys - without this the chatbot endpoint returns 503
      - key: OPENAI_MODEL
        value: "gpt-5-mini"
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "500"
      - key: CHATBOT_THROTTLE_RATE
        value: "20/hour"
      - key: PYTHON_VERSION
        value: "3.13.0"
      # Render serves this API over HTTPS but the Hostinger frontend is a different domain
      # (and currently plain http://) — cross-site cookies (session, csrf) are only sent by
      # the browser when SameSite=None, which browsers in turn only honor when Secure is set.
      - key: COOKIE_SAMESITE
        value: "None"
      - key: COOKIE_SECURE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
